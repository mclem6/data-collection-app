{% extends "base.html" %}

{% block title %}{{ title }} | Data Potluck{% endblock %}

{% block content %}

  {% if intro %}<p class="intro">{{ intro }}</p>{% endif %}

    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">{{ button }}</button>
  </form>
{% endblock %}
