{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4492d">
  <title>{% block title %}Data Potluck{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="header-inner">
      <div>
        <a href="/" class="brand">Data Potluck</a>
        <span class="tagline">Crowdsourced data collection project</span>
      </div>
      <nav class="site-nav">
        <a href="{% url 'about' %}">About</a>
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="link-button">Log out</button>
          </form>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Questions? <a href="mailto:support@datapotluck.com">support@datapotluck.com</a>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
